# Local development stack: `docker compose up --build`
#
# Host ports are deliberately non-default (5433 / 6380 / 8010) so NEXA can run next
# to other projects that already use 5432 / 6379 / 8000. Change them with the
# NEXA_*_PORT variables in .env if you need to.

services:
  db:
    # Official Postgres 16 image with the pgvector extension pre-installed.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa
      POSTGRES_DB: nexa
    ports:
      - "${NEXA_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa -d nexa"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Redis is not used until Week 4 (Celery background ingestion). It's started now
  # so the infrastructure is ready and `docker compose up` matches the plan.
  redis:
    image: redis:7-alpine
    ports:
      - "${NEXA_REDIS_PORT:-6380}:6379"

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database is reachable as "db:5432",
      # regardless of what DATABASE_URL in .env says for host-side tools.
      DATABASE_URL: postgresql+psycopg://nexa:nexa@db:5432/nexa
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/uploads
    # --reload restarts the server when you edit code (dev only).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log"
    ports:
      - "${NEXA_API_PORT:-8010}:8000"
    volumes:
      - ./backend:/app              # live code editing
      - ./scripts:/scripts          # helper scripts (seed, ask)
      - ./sample_data:/sample_data:ro
      - uploads:/data/uploads       # uploaded original files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Background worker: parses, chunks and embeds uploaded documents, so upload
  # requests return immediately. Watch it with: docker compose logs -f worker
  worker:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://nexa:nexa@db:5432/nexa
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/uploads
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  uploads:
